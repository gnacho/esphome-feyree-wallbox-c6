esphome:
  name: feyree-c6-discovery
  friendly_name: "Feyree Charger Discovery"
  name_add_mac_suffix: true

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# DEBUG logs every datapoint received, including datapoints without entities.
# Keep this configuration free of switch, number, select and button platforms
# until each datapoint has been verified against the charger display or app.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

web_server:

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

tuya:
