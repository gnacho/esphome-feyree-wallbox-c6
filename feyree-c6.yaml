esphome:
  name: feyree-c6
  friendly_name: "Feyree EV Charger"
  name_add_mac_suffix: true

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

web_server:

uart:
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

tuya:

switch:
  - platform: tuya
    name: "Feyree - Carga activa"
    switch_datapoint: 18

number:
  - platform: tuya
    name: "Feyree - Corriente carga"
    number_datapoint: 115
    min_value: 6
    max_value: 32
    step: 1
    unit_of_measurement: "A"

select:
  - platform: tuya
    name: "Feyree - Modo trabajo"
    enum_datapoint: 14
    options:
      0: "Carga inmediata"
      1: "Porcentaje"
      2: "Por energía"
      3: "Programado"

  - platform: tuya
    name: "Feyree - Comando carga"
    enum_datapoint: 124
    options:
      0: "Cargar"
      1: "Parar"
      2: "Listo"
      3: "Esperando"

sensor:
  - platform: tuya
    name: "Feyree - Voltaje L1"
    sensor_datapoint: 102
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: tuya
    name: "Feyree - Corriente L1"
    sensor_datapoint: 105
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: tuya
    name: "Feyree - Potencia"
    sensor_datapoint: 109
    unit_of_measurement: "kW"
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: tuya
    name: "Feyree - Temperatura"
    sensor_datapoint: 110
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    filters:
      - multiply: 0.1

  - platform: tuya
    name: "Feyree - Energía sesión"
    sensor_datapoint: 112
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
    device_class: energy
    filters:
      - multiply: 0.1
